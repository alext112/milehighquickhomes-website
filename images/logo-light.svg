<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 54" width="230" height="54" role="img" aria-label="Mile High Quick Homes">
  <title>Mile High Quick Homes</title>
  <!-- Mountain peaks -->
  <polyline points="6,40 20,14 30,26 36,18 50,40" fill="none" stroke="#E8B84B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- House -->
  <polygon points="24,40 16,40 24,28 32,40" fill="white"/>
  <rect x="20" y="34" width="8" height="6" fill="#E8B84B"/>
  <!-- Company name -->
  <text x="60" y="24" font-family="Georgia, serif" font-size="19" font-weight="700" fill="white" letter-spacing="-0.3">MILE HIGH</text>
  <text x="60" y="44" font-family="Georgia, serif" font-size="14" fill="#E8B84B" letter-spacing="1.5">QUICK HOMES</text>
</svg>
